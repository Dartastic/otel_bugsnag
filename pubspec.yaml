name: otel_bugsnag
description: OpenTelemetry bridge for bugsnag_flutter. Mirrors every captured event and breadcrumb as an OTel log record.
version: 0.1.0-beta.1-wip
repository: https://github.com/dartastic/otel_bugsnag
homepage: https://dartastic.io
publish_to: https://pub.dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.5
  dartastic_opentelemetry_api: ^1.0.0-beta.6
  flutter:
    sdk: flutter
  bugsnag_flutter: ^4.0.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  flutter_test:
    sdk: flutter

